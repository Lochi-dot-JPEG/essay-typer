<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="/style.css" />
    <title>typer</title>
    <link rel="icon" type="image/x-icon" href="/images/icon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <nav>
      <a href="/index.html">Home</a>
      <a href="/about.html">About</a>
    </nav>
    <h1>Hand Typer</h1>
    <div id="newSession" style="text-align: center" class="box">
      <h2>New Session</h2>
      <div class="timeselect">
        <button id="m10">-10</button>
        <button id="m1">-1</button>
        <p id="timepick">10min</p>
        <button id="p1">+1</button>
        <button id="p10">+10</button>
      </div>
      <button id="start" style="width: 70%; margin: 0 15%">Start</button>
    </div>
    <div id="typingMenu">
      <div class="box markdown" id="markedout"></div>
      <textarea
        autofocus
        placeholder="Write your masterpiece"
        rows="1"
        id="TypeArea"
      ></textarea>
      <p id="Timer">timer</p>
    </div>
  </body>
</html>
<script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
<script src="/script.js"></script>
<script src="/timer.js"></script>
<script src="/session-manager.js"></script>
